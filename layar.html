<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08182a">
<title>朝食メニュー · 館内表示（タブレット／サイネージ用）</title>
<link rel="stylesheet" href="menu.css">
</head>
<body class="layar-mode">

  <div id="layarIsi"></div>

  <div class="layar-bawah" id="layarBawah" style="display:none"></div>

  <div class="titik" id="titikSlide" style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px)"></div>

  <!-- overlay minta tap pertama (browser hanya izinkan fullscreen setelah sentuhan) -->
  <div class="minta-full" id="mintaFull">
    <b>タップして開始 / Tap to start</b>
    <span>全画面表示でメニューを表示します / Opens in full-screen display mode</span>
    <span style="opacity:.55">（タブレットは「スリープしない」設定にしてください）</span>
  </div>

  <script src="menu-app.js"></script>
  <script>
  (function () {
    "use strict";
    var bhs = MenuSarapan.bahasaAwal();
    var data = null;
    var daftar = [];
    var indeks = 0;
    var DURASI = 9000;           // ms per slide
    var timer = null;
    var geserPiksel = 0;

    function gambarSlide() {
      if (!daftar.length) return;
      var slide = daftar[indeks % daftar.length];
      MenuSarapan.renderSlide(document.getElementById("layarIsi"), slide, data, bhs);
      document.documentElement.lang = bhs === "en" ? "en" : "ja";
      // titik penanda
      document.getElementById("titikSlide").innerHTML = daftar.map(function (s, i) {
        return "<i class=\"" + (i === indeks % daftar.length ? "on" : "") + "\"></i>";
      }).join("");
      // anti burn-in: geser isi sedikit tiap putaran
      geserPiksel = (geserPiksel + 1) % 4;
      document.getElementById("layarIsi").style.transform =
        "translate(" + (geserPiksel - 1.5) * 2 + "px, " + (geserPiksel > 1 ? 1 : 0) + "px)";
    }

    function berikutnya() {
      indeks++;
      gambarSlide();
    }

    function mulaiPutar() {
      clearInterval(timer);
      gambarSlide();
      timer = setInterval(berikutnya, DURASI);
    }

    function muatData() {
      return MenuSarapan.muat().then(function (d) {
        if (!d) return;
        data = d;
        daftar = MenuSarapan.slideLayar(data, bhs);
        mulaiPutar();
      });
    }

    // ---- mode layar penuh ----
    function mintaLayarPenuh() {
      var el = document.documentElement;
      var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (fn) { try { fn.call(el); } catch (e) {} }
      document.getElementById("mintaFull").style.display = "none";
    }

    document.getElementById("mintaFull").addEventListener("click", function () {
      mintaLayarPenuh();
      jagaBangun();
      muatData();
    });

    // biar layar tablet nggak mati sendiri
    var wake = null;
    function jagaBangun() {
      if ("wakeLock" in navigator) {
        navigator.wakeLock.request("screen").then(function (w) { wake = w; }).catch(function () {});
      }
    }
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") { jagaBangun(); gambarSlide(); }
    });

    // sentuh untuk maju manual
    document.body.addEventListener("click", function () {
      if (document.getElementById("mintaFull").style.display !== "none") return;
      berikutnya();
    });

    // refresh data tiap 15 menit (menu harian ikut berubah)
    setInterval(function () {
      MenuSarapan.muat().then(function (d) {
        if (!d) return;
        data = d; daftar = MenuSarapan.slideLayar(data, bhs);
        if (indeks >= daftar.length) indeks = 0;
        gambarSlide();
      });
    }, 15 * 60 * 1000);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }

    // kalau sudah fullscreen (kiosk mode), langsung jalan tanpa perlu tap
    if (document.fullscreenElement) {
      document.getElementById("mintaFull").style.display = "none";
      muatData();
    }
  })();
  </script>
</body>
</html>
